<nav class="navbar">
  <a class="brand" routerLink="/">Predictly</a>
  <div class="links">
    @if (auth.isLoggedIn()) {
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Tournaments</a>
      <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
      <span class="username">{{ auth.currentUser()?.username }}</span>
      <button (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    }
  </div>
</nav>
